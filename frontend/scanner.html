<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ICT FAIR 2026 - Smart Scanner</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body class="bg-gradient-to-br from-sky-100 via-blue-50 to-cyan-100 min-h-screen overflow-x-hidden">

  <!-- BACKGROUND -->
  <div class="fixed inset-0 opacity-20 pointer-events-none">

    <div class="absolute top-0 left-0 w-72 h-72 bg-blue-300 rounded-full blur-3xl"></div>

    <div class="absolute bottom-0 right-0 w-96 h-96 bg-cyan-300 rounded-full blur-3xl"></div>

  </div>

  <div class="relative max-w-5xl mx-auto p-6">

    <!-- HEADER -->
    <div class="text-center mb-10">

      <div class="inline-block bg-white/80 backdrop-blur-lg px-8 py-5 rounded-3xl shadow-2xl">

        <h1 class="text-5xl md:text-6xl font-black text-blue-900 tracking-wide">

          ICT FAIR 2026

        </h1>

        <p class="text-blue-500 font-semibold mt-2 tracking-widest">

          SMART ATTENDANCE SCANNER

        </p>

      </div>

      <p class="mt-5 text-blue-800 text-lg font-semibold">

        Scan QR Code Students For Digital Attendance System

      </p>

    </div>

    <!-- NAVIGATION -->
    <div class="flex justify-end gap-4 mb-8">

      <a
        href="index.html"
        class="bg-gradient-to-r from-blue-500 to-cyan-500 hover:scale-105 transition text-white px-6 py-3 rounded-2xl shadow-lg font-semibold"
      >
        Dashboard
      </a>

      <a
        href="history.html"
        class="bg-gradient-to-r from-indigo-500 to-blue-600 hover:scale-105 transition text-white px-6 py-3 rounded-2xl shadow-lg font-semibold"
      >
        History
      </a>

    </div>

    <!-- MAIN CARD -->
    <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl border border-white/50 p-8">

      <div class="flex flex-col md:flex-row items-center justify-between gap-6 mb-8">

        <div>

          <h2 class="text-3xl font-bold text-blue-900">

            QR Attendance Scanner

          </h2>

          <p class="text-gray-500 mt-2">

            Scan student QR codes instantly using camera access

          </p>

        </div>

        <button
          onclick="startScanner()"
          class="bg-gradient-to-r from-purple-500 to-indigo-500 hover:scale-105 transition text-white px-8 py-4 rounded-2xl shadow-lg font-bold"
        >
          Start Scanner
        </button>

      </div>

      <!-- SCANNER -->
      <div class="bg-sky-50 border border-blue-100 rounded-3xl p-5">

        <div
          id="reader"
          class="w-full overflow-hidden rounded-2xl"
        ></div>

      </div>

      <!-- RESULT -->
      <div
        id="result"
        class="mt-8"
      ></div>

    </div>

    <!-- FOOTER -->
    <div class="text-center mt-10 text-blue-700 font-semibold">

      ICT FAIR 2026 • Smart Attendance System

    </div>

  </div>

  <script>

    const API = "https://presensi-barcode.vercel.app/api";

    function startScanner() {

      const html5QrCode =
        new Html5Qrcode("reader");

      Html5Qrcode.getCameras()

        .then((devices) => {

          if (devices.length) {

            const cameraId =
              devices[0].id;

            html5QrCode.start(

              cameraId,

              {
                fps: 10,
                qrbox: 250,
              },

              async (decodedText) => {

                await html5QrCode.stop();

                const response =
                  await fetch(
                    `${API}/attendance/scan`,
                    {
                      method: "POST",

                      headers: {
                        "Content-Type":
                        "application/json",
                      },

                      body: JSON.stringify({
                        qrData: decodedText
                      }),
                    }
                  );

                const data =
                  await response.json();

                if (!data.success) {

                  document.getElementById(
                    "result"
                  ).innerHTML = `

                    <div class="bg-red-100 border border-red-300 text-red-700 px-6 py-5 rounded-2xl shadow-lg">

                      <h2 class="text-2xl font-bold mb-2">
                        Scan Failed
                      </h2>

                      <p>
                        ${data.message}
                      </p>

                    </div>

                  `;

                  return;
                }

                document.getElementById(
                  "result"
                ).innerHTML = `

                  <div class="bg-green-100 border border-green-300 text-green-700 px-6 py-5 rounded-2xl shadow-lg">

                    <h2 class="text-3xl font-bold mb-4">
                      Attendance Success
                    </h2>

                    <div class="space-y-2 text-lg">

                      <p>
                        <span class="font-bold">
                          Name:
                        </span>
                        ${data.student.name}
                      </p>

                      <p>
                        <span class="font-bold">
                          Class:
                        </span>
                        ${data.student.class}
                      </p>

                      <p>
                        <span class="font-bold">
                          Status:
                        </span>
                        Present
                      </p>

                    </div>

                  </div>

                `;

                setTimeout(() => {

                  startScanner();

                }, 2000);

              },

              (errorMessage) => {

                console.log(errorMessage);

              }

            );

          }

        })

        .catch((err) => {

          console.log(err);

          alert(
            "Camera not found"
          );

        });

    }

  </script>

</body>

</html>
