<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ICT FAIR 2026 - Smart Attendance</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gradient-to-br from-sky-100 via-blue-50 to-cyan-100 min-h-screen overflow-x-hidden">

  <!-- BACKGROUND -->
  <div class="fixed inset-0 opacity-20 pointer-events-none">

    <div class="absolute top-0 left-0 w-72 h-72 bg-blue-300 rounded-full blur-3xl"></div>

    <div class="absolute bottom-0 right-0 w-96 h-96 bg-cyan-300 rounded-full blur-3xl"></div>

  </div>

  <div class="relative max-w-7xl mx-auto p-6">

    <!-- HERO -->
    <div class="text-center mb-10">

      <div class="flex justify-center mb-5">

        <div class="bg-white shadow-lg rounded-3xl px-6 py-4">

          <h1 class="text-5xl md:text-7xl font-black text-blue-900 drop-shadow-lg tracking-wide">

            ICT FAIR 2026

          </h1>

          <p class="text-blue-500 font-semibold mt-2 tracking-widest">

            SMART ATTENDANCE SYSTEM

          </p>

        </div>

      </div>

      <p class="text-xl text-blue-800 font-semibold">

        From Zero To Impact :
        Crafting Your Path As A Global Technology Innovator

      </p>

    </div>

    <!-- NAVIGATION -->
    <div class="flex justify-end gap-4 mb-8">

      <a
        href="scanner.html"
        class="bg-gradient-to-r from-blue-500 to-cyan-500 hover:scale-105 transition text-white px-6 py-3 rounded-2xl shadow-lg font-semibold"
      >
        Open Scanner
      </a>

      <a
        href="history.html"
        class="bg-gradient-to-r from-indigo-500 to-blue-600 hover:scale-105 transition text-white px-6 py-3 rounded-2xl shadow-lg font-semibold"
      >
        Attendance History
      </a>

    </div>

    <!-- MAIN CARD -->
    <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8 border border-white/50 mb-10">

      <div class="flex items-center gap-4 mb-6">

        <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center text-3xl">

          🎓

        </div>

        <div>

          <h2 class="text-3xl font-bold text-blue-900">

            Student Management

          </h2>

          <p class="text-gray-500">

            Add students and generate QR attendance cards

          </p>

        </div>

      </div>

      <!-- IMPORT -->
      <div class="bg-gradient-to-r from-sky-50 to-blue-50 border border-blue-100 rounded-2xl p-6 mb-8">

        <h3 class="text-2xl font-bold text-blue-800 mb-4">

          Import Spreadsheet

        </h3>

        <form
          id="importForm"
          class="flex flex-col md:flex-row gap-4"
        >

          <input
            type="file"
            id="excelFile"
            accept=".xlsx,.csv"
            class="border bg-white p-3 rounded-xl w-full"
          />

          <button
            type="submit"
            class="bg-gradient-to-r from-green-500 to-emerald-500 hover:scale-105 transition text-white px-6 py-3 rounded-2xl shadow-lg font-semibold"
          >
            Upload Spreadsheet
          </button>

        </form>

      </div>

      <!-- FORM -->
      <form
        id="studentForm"
        class="grid grid-cols-1 md:grid-cols-4 gap-4"
      >

        <input
          type="text"
          id="nis"
          placeholder="Student ID / NIS"
          class="border border-blue-100 bg-white p-4 rounded-2xl focus:outline-none focus:ring-4 focus:ring-blue-200"
        />

        <input
          type="text"
          id="name"
          placeholder="Student Name"
          class="border border-blue-100 bg-white p-4 rounded-2xl focus:outline-none focus:ring-4 focus:ring-blue-200"
        />

        <select
          id="student_class"
          class="border border-blue-100 bg-white p-4 rounded-2xl focus:outline-none focus:ring-4 focus:ring-blue-200"
        >

          <option value="">
            Select Class
          </option>

          <option>X-4</option>
          <option>X-5</option>
          <option>X-10</option>
          <option>X-11</option>

          <option>XI-3</option>
          <option>XI-4</option>
          <option>XI-5</option>
          <option>XI-10</option>
          <option>XI-11</option>

        </select>

        <button
          type="submit"
          class="bg-gradient-to-r from-blue-500 to-cyan-500 hover:scale-105 transition text-white font-bold rounded-2xl shadow-lg"
        >
          Save Student
        </button>

      </form>

    </div>

    <!-- DOWNLOAD -->
    <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-xl p-6 mb-10">

      <div class="flex flex-col md:flex-row gap-4">

        <select
          id="filterClass"
          class="border border-blue-100 p-4 rounded-2xl w-full md:w-72"
        >

          <option value="">
            Select Class
          </option>

          <option>X-4</option>
          <option>X-5</option>
          <option>X-10</option>
          <option>X-11</option>

          <option>XI-3</option>
          <option>XI-4</option>
          <option>XI-5</option>
          <option>XI-10</option>
          <option>XI-11</option>

        </select>

        <button
          onclick="downloadQRByClass()"
          class="bg-gradient-to-r from-purple-500 to-indigo-500 hover:scale-105 transition text-white px-6 py-4 rounded-2xl shadow-lg font-semibold"
        >
          Download QR ZIP
        </button>

      </div>

    </div>

    <!-- STUDENT LIST -->
    <div
      id="studentList"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
    >

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
